<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="title desc">
<title id="title">배치 중단 지점 재개와 별도의 동시성 검증</title>
<desc id="desc">위쪽 흐름은 대상을 페이지 단위로 처리하고 배치별 진행 위치를 기록한 뒤, 중단되면 기록한 위치부터 남은 범위를 처리하는 과정입니다. 아래쪽은 별도로 수행한 동시성 검증입니다. 9개 API에 13개 시나리오와 3·5·10개 동시 요청을 구성하고 잔액·원장·예산·후속 이벤트의 정합성을 대조했습니다. 두 흐름은 서로 다른 수행 내용을 나타냅니다.</desc>
