<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="title desc">
<title id="title">JPA 오류 재현에서 약 200만 건 데이터 보정까지</title>
<desc id="desc">실제 영속성 컨텍스트에서 저장 오류를 재현하고, 변경 감지 오류와 잘못 저장된 데이터를 식별한 뒤 보정 스크립트로 약 200만 건을 바로잡았습니다. 실제 저장 동작을 확인하는 회귀 테스트도 보강했습니다. 행성 크기는 수치의 비례를 나타내지 않습니다.</desc>
<defs>
  <radialGradient id="space"><stop stop-color="#162d3c" stop-opacity=".62"/><stop offset="1" stop-color="#03080e" stop-opacity=".3"/></radialGradient>
  <radialGradient id="cyan" cx="27%" cy="22%" r="79%"><stop stop-color="#f5f5dd"/><stop offset=".12" stop-color="#9be1de"/><stop offset=".43" stop-color="#287582"/><stop offset=".72" stop-color="#102b3c"/><stop offset="1" stop-color="#020810"/></radialGradient>
  <radialGradient id="gold" cx="24%" cy="18%" r="83%"><stop stop-color="#fff4cc"/><stop offset=".13" stop-color="#dcb66f"/><stop offset=".43" stop-color="#93612c"/><stop offset=".72" stop-color="#38251b"/><stop offset="1" stop-color="#090b11"/></radialGradient>
  <radialGradient id="ember" cx="26%" cy="19%" r="81%"><stop stop-color="#ffe5b6"/><stop offset=".14" stop-color="#e39968"/><stop offset=".43" stop-color="#984930"/><stop offset=".75" stop-color="#391c1e"/><stop offset="1" stop-color="#080910"/></radialGradient>
  <radialGradient id="silver" cx="25%" cy="18%" r="82%"><stop stop-color="#f7f9e9"/><stop offset=".2" stop-color="#a7b7bb"/><stop offset=".49" stop-color="#536672"/><stop offset=".8" stop-color="#1a2938"/><stop offset="1" stop-color="#050b13"/></radialGradient>
  <radialGradient id="night" cx="24%" cy="22%" r="80%"><stop offset=".38" stop-color="#000" stop-opacity="0"/><stop offset=".82" stop-color="#01040b" stop-opacity=".12"/><stop offset="1" stop-color="#01040b" stop-opacity=".77"/></radialGradient>
  <radialGradient id="halo"><stop offset=".64" stop-color="#6cafbc" stop-opacity="0"/><stop offset=".78" stop-color="#94d2d6" stop-opacity=".18"/><stop offset="1" stop-color="#759caa" stop-opacity="0"/></radialGradient>
  <clipPath id="globe"><circle r="1"/></clipPath>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="m0 0 8 4.5L0 9" fill="none" stroke="#e6c58d" stroke-width="1.8" stroke-linejoin="round"/></marker>
  <marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="m0 0 8 4.5L0 9" fill="none" stroke="#9dd8de" stroke-width="1.8" stroke-linejoin="round"/></marker>
  <style>
    text { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
    .label { fill: #f6f0e4; font-size: 22px; font-weight: 700; letter-spacing: -.025em; }
    .detail { fill: #b9cad2; font-size: 16px; }
    .caption { fill: #e6c58d; font-size: 15px; font-weight: 600; }
    .flow { fill: none; stroke: #e6c58d; stroke-width: 1.9; marker-end: url(#arrow); }
    .flow-cyan { fill: none; stroke: #9dd8de; stroke-width: 1.7; marker-end: url(#arrow-cyan); }
    .branch-label { fill: #e6c58d; stroke: #080f19; stroke-width: 7px; paint-order: stroke; stroke-linejoin: round; font-size: 15px; font-weight: 600; }
  </style>
