<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="title desc">
<title id="title">스냅샷 분기에 따른 개인화 피드 처리 흐름</title>
<desc id="desc">Feed API 요청을 Orchestrator가 받아 Snapshot을 조회합니다. Hit이면 저장된 결과를 반환합니다. Empty이면 검색 소스 9개의 후보를 모아 FPR에서 중복과 노출 이력을 제거하고, SPR에서 점수화하고, Re-Rank에서 최종 순서를 정해 새 Snapshot을 저장합니다. Orchestrator에는 캐시를 우회해 다시 계산하는 경로도 있습니다. 검색 소스별 타임아웃과 실패 처리를 분리했습니다. 화살표는 데이터 처리 순서를 나타냅니다.</desc>
