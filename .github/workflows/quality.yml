name: Verify Next.js application

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Korean screenshot fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match ":lang=ko"

      - name: Verify application
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Verify browser journeys
        timeout-minutes: 8
        env:
          ARCHIVE_CHROME: /usr/bin/google-chrome
          ARCHIVE_SOFTWARE_WEBGL: "1"
          ARCHIVE_REQUIRE_KOREAN_FONT: "1"
        run: |
          set -euo pipefail
          mkdir -p output/browser-ci
          test -x "$ARCHIVE_CHROME"
          "$ARCHIVE_CHROME" --version

          node node_modules/next/dist/bin/next start \
            --hostname 127.0.0.1 --port 4173 \
            > output/browser-ci/server.log 2>&1 &
          archive_server_pid=$!
          cleanup() {
            kill "$archive_server_pid" 2>/dev/null || true
            for attempt in {1..50}; do
              if ! kill -0 "$archive_server_pid" 2>/dev/null; then
                break
              fi
              sleep 0.1
            done
            kill -KILL "$archive_server_pid" 2>/dev/null || true
            wait "$archive_server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..60}; do
            if ! kill -0 "$archive_server_pid" 2>/dev/null; then
              cat output/browser-ci/server.log
              exit 1
            fi
            if curl --fail --silent --output /dev/null \
              --max-time 2 http://127.0.0.1:4173/; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat output/browser-ci/server.log
            exit 1
          fi

          browser_status=0
          node scripts/check-home-browser.mjs \
            http://127.0.0.1:4173 output/browser-ci/home \
            || browser_status=1
          node scripts/check-documents-browser.mjs \
            http://127.0.0.1:4173 output/browser-ci/documents \
            || browser_status=1
          exit "$browser_status"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/browser-ci/
          retention-days: 7
          if-no-files-found: warn
          compression-level: 1
